<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicXML ドレミ自動付与ツール（完全版/和音対応/名前空間対応）</title>
<style>
body {
  font-family: sans-serif;
  padding: 2em;
  background: #f7f7f7;
}
h1 { color: #333; }
button {
  margin-top: 1em;
  padding: 0.6em 1.2em;
  background: #0078d7;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
button:hover { background: #005ea6; }
#preview {
  background: #fff;
  padding: 1em;
  border: 1px solid #ccc;
  margin-top: 1em;
  white-space: pre-wrap;
  font-size: 0.9em;
  max-height: 400px;
  overflow-y: scroll;
}
</style>
</head>
<body>
<h1>🎵 MusicXML ドレミ付与（完全版・和音対応・名前空間対応）</h1>
<p>MusicXML ファイルを選択してください。</p>
<input type="file" id="fileInput" accept=".xml,.musicxml" />
<button id="processBtn">ドレミ付きXMLを生成</button>

<h2>出力プレビュー</h2>
<a id="downloadLink" style="display:none;">score_doremi.xml をダウンロード</a>
<pre id="preview"></pre>

<script>
/** ドレミ変換 + オクターブ上付き数字 */
function toDoremi(step, alter, octave) {
  const base = {C:"ド", D:"レ", E:"ミ", F:"ファ", G:"ソ", A:"ラ", B:"シ"};
  let name = base[step] || step;
  if (alter === 1) name += "♯";
  if (alter === -1) name += "♭";
  const supers = String(octave).replace(/[0-9]/g, d => "⁰¹²³⁴⁵⁶⁷⁸⁹"[d]);
  return name + supers;
}

document.getElementById("processBtn").onclick = () => {
  const file = document.getElementById("fileInput").files[0];
  if (!file) return alert("MusicXMLファイルを選択してください。");

  const reader = new FileReader();
  reader.onload = e => {
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(e.target.result, "application/xml");

    const ns = xmlDoc.documentElement.namespaceURI;
    const notes = xmlDoc.getElementsByTagNameNS(ns, "note");

    let chordGroup = [];

    function flushChordGroup() {
      if (chordGroup.length === 0) return;

      const count = chordGroup.length;

      chordGroup.forEach((noteNode, idx) => {
        const pitch = noteNode.getElementsByTagNameNS(ns, "pitch")[0];
        if (!pitch) return;

        const step = pitch.getElementsByTagNameNS(ns, "step")[0]?.textContent;
        const alter = parseInt(pitch.getElementsByTagNameNS(ns, "alter")[0]?.textContent || 0);
        const octave = parseInt(pitch.getElementsByTagNameNS(ns, "octave")[0]?.textContent || 4);

        const lyricText = toDoremi(step, alter, octave);

        // lyric（名前空間付きで生成）
        const lyric = xmlDoc.createElementNS(ns, "lyric");
        lyric.setAttribute("number", idx + 1);

        const text = xmlDoc.createElementNS(ns, "text");
        text.textContent = lyricText;
        lyric.appendChild(text);

        // 和音数でフォントサイズ調整
        const size = Math.max(65, 100 - (count - 1) * 15);
        const font = xmlDoc.createElementNS(ns, "font");
        font.setAttribute("font-size", size + "%");
        lyric.appendChild(font);

        noteNode.appendChild(lyric);
      });

      chordGroup = [];
    }

    // すべての note を走査
    for (let i = 0; i < notes.length; i++) {
      const n = notes[i];
      const isChord = n.getElementsByTagNameNS(ns, "chord").length > 0;

      if (!isChord) {
        flushChordGroup();     // 前の和音を確定
        chordGroup = [n];      // 新グループ開始
      } else {
        chordGroup.push(n);    // 同時和音
      }
    }
    flushChordGroup(); // 最後の和音も処理

    // XML 書き出し
    const serializer = new XMLSerializer();
    const output = serializer.serializeToString(xmlDoc);

    document.getElementById("preview").textContent =
      output.substring(0, 2000) + "\n...\n";

    const blob = new Blob([output], { type: "application/xml" });
    const url = URL.createObjectURL(blob);
    const link = document.getElementById("downloadLink");
    link.href = url;
    link.download = "score_doremi.xml";
    link.style.display = "inline";
    link.textContent = "score_doremi.xml をダウンロード";
  };

  reader.readAsText(file);
};
</script>
</body>
</html>
